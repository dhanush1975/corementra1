# Response headers for the Amplify-hosted site (applied on every deploy).
customHeaders:
  - pattern: '**'
    headers:
      # Only our own code runs here. Calendly is allowed as an embedded
      # frame only; AWS endpoints are the Cognito / AppSync / S3 calls.
      # images.pexels.com serves the blog's cover photos.
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' data: https://fonts.gstatic.com;
          img-src 'self' data: blob: https://images.unsplash.com https://images.pexels.com https://*.amazonaws.com;
          connect-src 'self' https://*.amazonaws.com wss://*.amazonaws.com;
          frame-src https://calendly.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
      - key: X-Frame-Options
        value: DENY
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
